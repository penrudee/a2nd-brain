[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-a2nd-brain"
version = "0.1.0"
description = "Executa for the a2nd-brain Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-a2nd-brain" = "a2nd_brain_plugin:main"

[tool.setuptools]
py-modules = ["a2nd_brain_plugin"]
